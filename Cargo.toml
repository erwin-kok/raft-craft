[workspace]
members = [
    "raft-core",
    "raft-runtime",
    "raft-simulator",
]

resolver = "2"

[workspace.package]
homepage = "https://github.com/erwin-kok/raft-craft"
repository = "https://github.com/erwin-kok/raft-craft"
repository_type = "git"
authors = ["Erwin Kok"]
description = "A from-scratch implementation of the Raft consensus algorithm in Rust, for learning and research purposes."
keywords = ["Raft", "distributed systems", "Rust", "consensus algorithm"]
readme = "README.md"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json"] }
crossterm = "0.29"
parking_lot = "0.12"
rand = "0.10.1"
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
